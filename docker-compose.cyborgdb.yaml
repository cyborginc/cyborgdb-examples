version: '3.8'
services:
  cyborgdb:
    image: cyborginc/cyborgdb-service:latest
    ports:
      - "8001:8000"
    environment:
      - CYBORGDB_DB_TYPE=postgres
      - CYBORGDB_CONNECTION_STRING=
      - CYBORGDB_API_KEY=
    depends_on:
      - postgres
    restart: on-failure
  
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=cyborgdb
      - POSTGRES_USER=cyborgdb
      - POSTGRES_PASSWORD=secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    # Add health check to ensure postgres is ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyborgdb -d cyborgdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: